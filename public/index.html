<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>Entre com sua conta Google e escolha um número entre 1 e 100. A figura será assinada com seu e-mail confirmado pelo Google.</p>
    </header>
    <section aria-label="Login Google">
      <div id="login-google"></div>
      <p id="status-login" role="status" aria-live="polite">Entre com sua conta Google.</p>
      <button id="sair-google" type="button" hidden>Sair do login</button>
    </section>
    <form id="formulario" novalidate>
      <label for="numero">Número</label>
      <input id="numero" name="numero" type="number" min="1" max="100" step="1" required placeholder="80">
      <button id="gerar" type="submit">Desenhar</button>
    </form>
    <p id="mensagem" role="alert"></p>
    <figure id="desenho" aria-live="polite"></figure>
    <button id="baixar" type="button" hidden>Baixar SVG</button>
  </main>
</body>
</html>
